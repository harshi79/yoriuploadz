# YoriUpload — Netlify configuration

[build]
  publish = "."
  functions = "netlify/functions"

# Rewrite the upload endpoint logic.
[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200

[[redirects]]
  from = "/api/import"
  to = "/.netlify/functions/import-url"
  status = 200

# Keep repo files out of the served site.
[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/LICENSE"
  to = "/index.html"
  status = 200

# SPA-style fallback for any other path (functions are matched first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
